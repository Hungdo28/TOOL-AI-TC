    <!-- MAIN REVIEW SCRIPT -->
    <script>
        // ================= CẤU HÌNH SUPABASE & SESSION =================
        const SUPABASE_URL = 'https://zrwlzthteixjxdhsevkh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_yA_P7i5OXAffRJwHx3hGvw_Wyo02_u3';

        // Đọc thông tin user đăng nhập
        const currentUserJson = localStorage.getItem('currentUser');
        let currentUser = { username: 'Guest', role: 'viewer', fullName: 'Khách' };
        if (!currentUserJson) {
            const isDemo = new URLSearchParams(location.search).get('demo') === '1';
            if (!isDemo) {
                // Lưu URL hiện tại để chuyển tiếp lại sau khi login thành công
                window.location.replace('login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search));
            }
        } else {
            try {
                currentUser = JSON.parse(currentUserJson);
            } catch (_) {}
        }

        const userBadge = document.getElementById('userBadge');
        const userName = document.getElementById('userName');
        if (userBadge && userName) {
            userBadge.classList.remove('hidden');
            userName.textContent = currentUser.fullName || currentUser.username || 'User';
        }

        // Supabase REST client fetch helper
        const api = async (path, opt = {}) => {
            const url = `${SUPABASE_URL.replace(/\/$/, '')}/rest/v1/${path}`;
            const res = await fetch(url, {
                ...opt,
                headers: {
                    apikey: SUPABASE_ANON_KEY,
                    Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json',
                    ...(opt.headers || {})
                }
            });
            if (!res.ok) {
                const errText = await res.text();
                throw new Error(errText || `Lỗi HTTP ${res.status}`);
            }
            return res.status === 204 ? null : res.json();
        };

        // ================= STATE QUẢN LÝ =================
        let rawRows = [];          // Dữ liệu gốc từ Supabase
        let choice = {};           // Trạng thái duyệt người dùng chọn: { [id]: 'pending' | 'approved' | 'rejected' }
        let currentFilter = 'pending'; // 'pending' | 'approved' | 'rejected' | 'all'
        let searchQuery = '';
        let allExpanded = false;
        let isMockMode = false;
        let sortAsc = true;

        // Thuật toán sắp xếp tự nhiên theo thứ tự số cho testcase ([TC]_1 -> [TC]_178 hoặc TC_01 -> TC_99)
        const testcaseCollator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });

        function extractTestcaseSortKey(item) {
            if (!item) return { code: '', num: null, raw: '' };
            const content = item.content || {};
            const code = String(content.id || content.ma_testcase || content.ma || item.id || '').trim();
            const numMatch = code.match(/\d+/);
            const num = numMatch ? parseInt(numMatch[0], 10) : null;
            return {
                code,
                num,
                raw: String(content.muc_dich || item.test_suite || '')
            };
        }

        function compareTestcaseOrder(a, b, ascending = true) {
            const keyA = extractTestcaseSortKey(a);
            const keyB = extractTestcaseSortKey(b);
            let diff = 0;

            if (keyA.code && keyB.code) {
                const prefixA = keyA.code.replace(/\d+.*$/, '').trim();
                const prefixB = keyB.code.replace(/\d+.*$/, '').trim();

                if (prefixA === prefixB && keyA.num !== null && keyB.num !== null && keyA.num !== keyB.num) {
                    diff = keyA.num - keyB.num;
                } else {
                    diff = testcaseCollator.compare(keyA.code, keyB.code);
                }
            } else if (keyA.code) {
                diff = -1;
            } else if (keyB.code) {
                diff = 1;
            } else {
                diff = testcaseCollator.compare(keyA.raw, keyB.raw);
            }

            return ascending ? diff : -diff;
        }

        function toggleSortOrder() {
            sortAsc = !sortAsc;
            const label = document.getElementById('sortOrderLabel');
            if (label) {
                label.textContent = sortAsc ? 'Thứ tự: Tăng dần' : 'Thứ tự: Giảm dần';
            }
            const icon = document.getElementById('sortOrderIcon');
            if (icon) {
                icon.setAttribute('data-lucide', sortAsc ? 'arrow-down-narrow-wide' : 'arrow-up-narrow-wide');
            }
            renderCards();
            if (window.lucide) window.lucide.createIcons();
        }

        const STAT_LABELS = {
            pending: 'Chưa duyệt',
            approved: 'Đã giữ',
            rejected: 'Đã bỏ',
            all: 'Tất cả'
        };

        // ================= KHỞI TẠO =================
        window.addEventListener('DOMContentLoaded', async () => {
            initBackButton();
            await loadProblemsList();
        });

        function initBackButton() {
            const backParam = new URLSearchParams(location.search).get('back');
            const btnBack = document.getElementById('btnBack');
            if (btnBack) {
                btnBack.href = backParam ? decodeURIComponent(backParam) : 'index.html';
            }
        }

        // ================= TẢI DANH SÁCH BÀI TOÁN =================
        async function loadProblemsList() {
            showLoading(true, 'Đang tải danh sách bài toán...');
            const select = document.getElementById('probSelect');
            select.innerHTML = '<option value="">Đang tải bài toán...</option>';

            const urlProb = new URLSearchParams(location.search).get('problem_id') ||
                            new URLSearchParams(location.search).get('task');

            try {
                // Tải danh sách bài toán từ qa_memory
                const records = await api('qa_memory?kind=eq.testcase&select=problem_id,problem_title&order=created_at.desc&limit=2000');
                
                const probMap = new Map();
                if (Array.isArray(records)) {
                    records.forEach(r => {
                        if (r.problem_id) {
                            probMap.set(r.problem_id, r.problem_title || r.problem_id);
                        }
                    });
                }

                // Nếu URL có truyền problem_id mà chưa có trong DB, vẫn thêm vào dropdown
                if (urlProb && !probMap.has(urlProb)) {
                    probMap.set(urlProb, urlProb);
                }

                select.innerHTML = '';
                if (probMap.size === 0) {
                    const opt = document.createElement('option');
                    opt.value = urlProb || 'demo_problem';
                    opt.textContent = urlProb || 'Bài toán mẫu (Demo)';
                    select.appendChild(opt);
                } else {
                    probMap.forEach((title, id) => {
                        const opt = document.createElement('option');
                        opt.value = id;
                        opt.textContent = title;
                        select.appendChild(opt);
                    });
                }

                if (urlProb && probMap.has(urlProb)) {
                    select.value = urlProb;
                }

                select.onchange = () => loadTestcases();
                await loadTestcases();
            } catch (err) {
                console.error('Lỗi khi tải danh sách bài toán:', err);
                // Nếu lỗi kết nối, vẫn cho phép chọn problem từ URL hoặc test
                select.innerHTML = '';
                const fallbackOpt = document.createElement('option');
                fallbackOpt.value = urlProb || 'current_task';
                fallbackOpt.textContent = urlProb || 'Bài toán hiện tại';
                select.appendChild(fallbackOpt);
                select.onchange = () => loadTestcases();
                await loadTestcases();
            }
        }

        // ================= TẢI DANH SÁCH TESTCASE =================
        async function loadTestcases() {
            const probId = document.getElementById('probSelect').value;
            const probTitle = document.getElementById('probSelect').selectedOptions[0]?.textContent || probId;
            document.getElementById('currentTaskTitle').textContent = probTitle || '—';

            if (!probId) {
                showEmptyState(true, 'Vui lòng chọn bài toán', 'Chọn một bài toán ở thanh điều hướng phía trên để xem các testcase.');
                return;
            }

            showLoading(true, 'Đang tải danh sách testcase từ Supabase...');

            try {
                // Query bài toán theo problem_id hoặc problem_title
                const encoded = encodeURIComponent(probId);
                const queryPath = `qa_memory?kind=eq.testcase&or=(problem_id.eq.${encoded},problem_title.eq.${encoded},problem_title.ilike.${encoded})&select=id,problem_id,problem_title,test_suite,content,review_status,approved&order=created_at.asc,id.asc&limit=2000`;
                
                const data = await api(queryPath);
                isMockMode = false;

                if (!Array.isArray(data) || data.length === 0) {
                    rawRows = [];
                    choice = {};
                    showEmptyState(
                        true,
                        'Chưa có testcase nào trong Supabase',
                        `Bài toán "${probTitle}" chưa có bản ghi testcase nào được nạp vào bảng qa_memory. Bạn có thể nạp bộ testcase mẫu để trải nghiệm thử giao diện.`
                    );
                    updateCounters();
                    return;
                }

                showEmptyState(false);
                rawRows = data.map(normalizeRow).sort((a, b) => compareTestcaseOrder(a, b, sortAsc));
                choice = {};
                rawRows.forEach(r => {
                    choice[r.id] = r.review_status || (r.approved === true ? 'approved' : (r.approved === false ? 'rejected' : 'pending'));
                });

                renderCards();
                updateCounters();
                if (window.lucide) window.lucide.createIcons();
            } catch (err) {
                console.error('Lỗi khi tải testcase:', err);
                showEmptyState(
                    true,
                    'Không thể kết nối Supabase',
                    `Đã xảy ra lỗi: ${err.message}. Bạn có thể bấm nút bên dưới để xem giao diện với dữ liệu mẫu.`
                );
            }
        }

        // Chuẩn hóa một bản ghi testcase
        function normalizeRow(item) {
            let content = item.content;
            if (typeof content === 'string') {
                try { content = JSON.parse(content); } catch (_) { content = { raw: content }; }
            }
            content = content || {};

            return {
                id: item.id || `tc_${Math.random().toString(36).substring(2, 9)}`,
                test_suite: item.test_suite || content.test_suite || content.suite || content.nhom || 'Chung',
                review_status: item.review_status || 'pending',
                approved: item.approved,
                content: {
                    id: content.id || content.ma_testcase || content.ma || '',
                    muc_dich: content.muc_dich || content.mục_đích || content.name || content.title || content.description || '',
                    cac_buoc: content.cac_buoc || content.các_bước || content.cac_buoc_thuc_hien || content.steps || '',
                    ket_qua_mong_muon: content.ket_qua_mong_muon || content.kết_quả_mong_muốn || content.expected || content.expected_result || '',
                    ghi_chu: content.ghi_chu || content.ghi_chú || content.notes || content.precondition || ''
                },
                _open: false
            };
        }

        // ================= LỌC & TÌM KIẾM =================
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                const isActive = tab.getAttribute('data-filter') === filter;
                tab.className = isActive
                    ? 'filter-tab px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all bg-slate-900 text-white shadow-xs'
                    : 'filter-tab px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200';
            });
            renderCards();
        }

        function handleSearch(val) {
            searchQuery = (val || '').toLowerCase().trim();
            renderCards();
        }

        const getVisibleRows = () => {
            return rawRows.filter(r => {
                const st = choice[r.id] || 'pending';
                if (currentFilter !== 'all' && st !== currentFilter) return false;
                if (!searchQuery) return true;

                const c = r.content || {};
                const haystack = [
                    r.test_suite,
                    c.id,
                    c.muc_dich,
                    c.cac_buoc,
                    c.ket_qua_mong_muon,
                    c.ghi_chu
                ].join(' ').toLowerCase();

                return haystack.includes(searchQuery);
            });
        };

        // ================= RENDER GIAO DIỆN CARDS =================
        function renderCards() {
            const container = document.getElementById('testcaseList');
            container.innerHTML = '';

            const visible = getVisibleRows();

            if (visible.length === 0) {
                if (rawRows.length > 0) {
                    container.innerHTML = `
                        <div class="bg-white p-8 rounded-2xl border border-slate-200/80 text-center space-y-2">
                            <i data-lucide="filter-x" class="w-8 h-8 text-slate-400 mx-auto"></i>

                            <p class="text-xs text-slate-500">Thử đổi tab trạng thái hoặc xóa từ khóa tìm kiếm.</p>
                        </div>
                    `;
                    if (window.lucide) window.lucide.createIcons();
                }
                return;
            }

            // Nhóm theo test_suite
            const grouped = {};
            visible.forEach(r => {
                const suite = r.test_suite || 'Chung';
                (grouped[suite] = grouped[suite] || []).push(r);
            });

            // Sắp xếp các testcase trong mỗi nhóm theo thứ tự tự nhiên (tăng dần / giảm dần)
            Object.values(grouped).forEach(list => {
                list.sort((a, b) => compareTestcaseOrder(a, b, sortAsc));
            });

            // Sắp xếp các nhóm (suites) theo thứ tự testcase đầu tiên
            const sortedSuites = Object.entries(grouped).sort(([suiteA, listA], [suiteB, listB]) => {
                const itemA = sortAsc ? listA[0] : listA[listA.length - 1];
                const itemB = sortAsc ? listB[0] : listB[listB.length - 1];
                return compareTestcaseOrder(itemA, itemB, sortAsc);
            });

            sortedSuites.forEach(([suiteName, list]) => {
                const groupEl = document.createElement('div');
                groupEl.className = 'space-y-3';

        }

        // ================= THAY ĐỔI TRẠNG THÁI =================
        function setChoice(id, targetStatus) {
            const current = choice[id] || 'pending';
            // Click lần nữa vào trạng thái đang chọn sẽ quay lại 'pending' (hủy chọn)
            choice[id] = current === targetStatus ? 'pending' : targetStatus;
            
            renderCards();
            updateCounters();
        }

        function bulkSetStatus(targetStatus) {
            const visible = getVisibleRows();
            if (visible.length === 0) {
                showToast('Không có testcase nào đang hiển thị để thao tác', 'info');
                return;
            }
            visible.forEach(r => {
                choice[r.id] = targetStatus;
            });
            renderCards();
            updateCounters();
            showToast(`Đã chuyển ${visible.length} testcase sang trạng thái "${STAT_LABELS[targetStatus]}"`, 'success');
        }

        function toggleExpandAll() {
            allExpanded = !allExpanded;
            rawRows.forEach(r => r._open = allExpanded);
            renderCards();
            const btn = document.getElementById('btnToggleAll');
            if (btn) {
                btn.title = allExpanded ? 'Thu gọn tất cả' : 'Mở rộng tất cả';
            }
        }

        function discardChanges() {
            if (!confirm('Bạn có chắc chắn muốn hủy bỏ tất cả các thay đổi chưa lưu?')) return;
            rawRows.forEach(r => {
                choice[r.id] = r.review_status || 'pending';
            });
            renderCards();
            updateCounters();
            showToast('Đã hoàn tác các thay đổi', 'info');
        }

        // ================= CẬP NHẬT COUNTER & STATS =================
        function updateCounters() {
            const total = rawRows.length;
            const countByStatus = {
                pending: 0,
                approved: 0,
                rejected: 0
            };

            rawRows.forEach(r => {
                const st = choice[r.id] || 'pending';
                if (countByStatus[st] !== undefined) countByStatus[st]++;
            });

            // Update số liệu thẻ thống kê
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statPending').textContent = countByStatus.pending;
            document.getElementById('statApproved').textContent = countByStatus.approved;
            document.getElementById('statRejected').textContent = countByStatus.rejected;

            // Update tab badges
            document.querySelectorAll('.filter-tab').forEach(tab => {
                const f = tab.getAttribute('data-filter');
                const badge = tab.querySelector('.tab-count');
                if (badge) {
                    badge.textContent = f === 'all' ? total : (countByStatus[f] || 0);
                }
            });

            // Update Progress bar
            const reviewed = countByStatus.approved + countByStatus.rejected;
            const pct = total > 0 ? Math.round((reviewed / total) * 100) : 0;
            const approvedPct = total > 0 ? (countByStatus.approved / total) * 100 : 0;
            const rejectedPct = total > 0 ? (countByStatus.rejected / total) * 100 : 0;

            document.getElementById('progressText').textContent = `${pct}% hoàn tất (${reviewed}/${total})`;
            document.getElementById('progressBarApproved').style.width = `${approvedPct}%`;
            document.getElementById('progressBarRejected').style.width = `${rejectedPct}%`;

            // Kiểm tra số thay đổi chưa lưu
            const unsaved = rawRows.filter(r => (choice[r.id] || 'pending') !== (r.review_status || 'pending')).length;
            const btnSave = document.getElementById('btnSave');
            const unsavedText = document.getElementById('unsavedCountText');
            const saveDot = document.getElementById('saveStatusDot');
            const btnDiscard = document.getElementById('btnDiscard');

            if (unsaved > 0) {
                btnSave.disabled = false;
                unsavedText.textContent = `${unsaved} thay đổi chưa lưu`;
                unsavedText.className = 'font-bold text-amber-600';
                saveDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 badge-pulse';
                btnDiscard.classList.remove('hidden');
            } else {
                btnSave.disabled = true;
                unsavedText.textContent = 'Dữ liệu đã đồng bộ';
                unsavedText.className = 'font-bold text-slate-500';
                saveDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
                btnDiscard.classList.add('hidden');
            }
        }

        // ================= LƯU KẾT QUẢ DUYỆT =================
        async function saveReviewResults() {
            if (isMockMode) {
                // Nếu đang ở chế độ mock
                rawRows.forEach(r => r.review_status = choice[r.id]);
                updateCounters();
                showToast('Chế độ Demo: Đã lưu kết quả duyệt vào bộ nhớ tạm thời!', 'success');
                return;
            }

            const btnSave = document.getElementById('btnSave');
            const label = document.getElementById('btnSaveLabel');
            btnSave.disabled = true;
            label.textContent = 'Đang lưu vào Supabase...';

            try {
                // Cập nhật từng nhóm trạng thái
                for (const s of ['approved', 'rejected', 'pending']) {
                    const idsToUpdate = rawRows
                        .filter(r => (choice[r.id] || 'pending') === s && (r.review_status || 'pending') !== s)
                        .map(r => r.id);

                    if (idsToUpdate.length > 0) {
                        await api(`qa_memory?id=in.(${idsToUpdate.join(',')})`, {
                            method: 'PATCH',
                            headers: { Prefer: 'return=minimal' },
                            body: JSON.stringify({
                                review_status: s,
                                approved: s === 'approved',
                                reviewed_at: new Date().toISOString()
                            })
                        });
                    }
                }

                // Cập nhật lại trạng thái gốc sau khi lưu thành công
                rawRows.forEach(r => {
                    r.review_status = choice[r.id];
                    r.approved = choice[r.id] === 'approved';
                });

                showToast('Đã lưu kết quả duyệt testcase thành công!', 'success');
            } catch (err) {
                console.error('Lỗi khi lưu kết quả:', err);
                showToast(`Lưu thất bại: ${err.message}`, 'error');
            } finally {
                label.textContent = 'Lưu kết quả duyệt';
                updateCounters();
            }
        }

        // ================= XUẤT FILE JSON =================
        function exportSelectedJson() {
            const approvedList = rawRows.filter(r => choice[r.id] === 'approved');
            if (approvedList.length === 0) {
                if (!confirm('Hiện chưa có testcase nào được đánh dấu "Đã giữ". Bạn có muốn xuất toàn bộ testcase không?')) {
                    return;
                }
            }

            const exportData = (approvedList.length > 0 ? approvedList : rawRows).map(r => ({
                id: r.content.id,
                test_suite: r.test_suite,
                muc_dich: r.content.muc_dich,
                cac_buoc: r.content.cac_buoc,
                ket_qua_mong_muon: r.content.ket_qua_mong_muon,
                ghi_chu: r.content.ghi_chu,
                review_status: choice[r.id] || 'pending'
            }));

            const probTitle = document.getElementById('probSelect').selectedOptions[0]?.textContent || 'testcases';
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Testcases_${probTitle.replace(/[^a-zA-Z0-9_\u00C0-\u024F\u1E00-\u1EFF]/g, '_')}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`Đã xuất ${exportData.length} testcase ra file JSON!`, 'success');
        }

        // ================= TIỆN ÍCH HIỂN THỊ =================
        function showLoading(show, message = 'Đang tải...') {
            const container = document.getElementById('testcaseList');
            if (show) {
                container.innerHTML = `
                    <div class="bg-white p-12 rounded-3xl border border-slate-200/80 text-center space-y-3 shadow-xs">
                        <div class="w-10 h-10 border-4 border-slate-100 border-t-blue-600 rounded-full animate-spin mx-auto"></div>
                        <p class="text-sm font-bold text-slate-700">${escapeHtml(message)}</p>
                    </div>
                `;
            }
        }

        function showEmptyState(show, title = '', desc = '') {
            const state = document.getElementById('stateMessage');
            const list = document.getElementById('testcaseList');
            if (show) {
                list.innerHTML = '';
                state.classList.remove('hidden');
                document.getElementById('stateTitle').textContent = title;
                document.getElementById('stateDesc').textContent = desc;
                if (window.lucide) window.lucide.createIcons();
            } else {
                state.classList.add('hidden');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            const iconEl = document.getElementById('toastIcon');

            msgEl.textContent = message;
            toast.className = `fixed top-5 right-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 flex items-center gap-2 px-5 py-3 rounded-2xl shadow-xl text-sm font-semibold text-white ${
                type === 'error' ? 'bg-rose-600 shadow-rose-600/30' :
                type === 'info' ? 'bg-blue-600 shadow-blue-600/30' : 'bg-emerald-600 shadow-emerald-600/30'
            }`;

            iconEl.setAttribute('data-lucide', type === 'error' ? 'alert-triangle' : (type === 'info' ? 'info' : 'check-circle'));
            if (window.lucide) window.lucide.createIcons();

            setTimeout(() => {
                toast.classList.add('-translate-y-12', 'opacity-0');
            }, 3500);
        }

        function escapeHtml(text = '') {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
